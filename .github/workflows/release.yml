name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: |
          python scripts/build_layout_guides.py
          python scripts/build_codex_package.py
          python scripts/verify_sprite.py
          python scripts/verify_metadata.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test and package
        shell: pwsh
        run: |
          dotnet build ShenshenPet.sln --configuration Release
          dotnet run --project tests/ShenshenPet.Core.Tests --configuration Release --no-build
          ./scripts/build-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: shenshen-pet-release
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = Get-ChildItem -LiteralPath dist -File
          $notesFile = Join-Path 'docs/releases' "$env:GITHUB_REF_NAME.md"
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME)
          $arguments += $releaseFiles.FullName
          $arguments += @('--title', $env:GITHUB_REF_NAME)
          if (Test-Path -LiteralPath $notesFile) {
            $arguments += @('--notes-file', $notesFile)
          }
          else {
            $arguments += '--generate-notes'
          }
          & gh @arguments
